<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="section">
        <div class="parent_block">
            <div class="child_block"></div>
        </div>
    </div>

    <div class="section">
        <div class="stopwatch">
            <div id="seconds">0</div>
            <div class="buttons">
                <button id="start">Start</button>
                <button id="stop">Stop</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="tab_slider">
            <div class="tab_content_blocks">
                <div class="tab_content_block">Слайд 1</div>
                <div class="tab_content_block">Слайд 2</div>
                <div class="tab_content_block">Слайд 3</div>
                <div class="tab_content_block">Слайд 4</div>
            </div>
            <div class="tab_content_items">
                <div class="tab_content_item tab_content_item_active">Таб 1</div>
                <div class="tab_content_item">Таб 2</div>
                <div class="tab_content_item">Таб 3</div>
                <div class="tab_content_item">Таб 4</div>
            </div>
        </div>
    </div>

</body>
<script src="main.js"></script>
</html>
